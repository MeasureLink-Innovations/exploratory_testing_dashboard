services:
  db:
    image: postgres:16-alpine
    container_name: etd-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: exploratory_testing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exploratory_testing"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  backend:
    image: ${BACKEND_IMAGE:-exploratory-testing-backend:latest}
    container_name: etd-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@db:5432/exploratory_testing
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      TRUST_PROXY: "1"
      HSTS_ENABLED: "false"
    command: >
      sh -c "npx prisma migrate deploy && npm run start"
    expose:
      - "3000"
    networks:
      - private

  frontend:
    image: ${FRONTEND_IMAGE:-exploratory-testing-frontend:latest}
    container_name: etd-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ETD_THEME: ${ETD_THEME:-paper}
    command: npm run start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.json
    expose:
      - "4200"
    networks:
      - private

  caddy:
    image: caddy:2-alpine
    container_name: etd-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      ETD_DOMAIN: ${ETD_DOMAIN:?Set ETD_DOMAIN to the public hostname}
      HSTS_HEADER: ${HSTS_HEADER:-max-age=300}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - private

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  public:
  private:
    internal: true
